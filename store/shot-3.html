<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;background:#f4f1ea;color:#1f1d1a;font-family:-apple-system,'PingFang SC',sans-serif;padding:56px 64px;overflow:hidden}
h1{font:600 44px/1.2 'Songti SC',serif;letter-spacing:.02em}
h1 em{font-style:normal;color:#b8432f}
p.sub{margin-top:12px;font-size:20px;color:#5a554c}
.row{display:flex;align-items:center;gap:28px;margin-top:36px}
.col{flex:1}
.tag{display:inline-block;font-size:15px;font-weight:600;padding:5px 12px;border-radius:6px;margin-bottom:12px;background:#e9e3d6;color:#5a554c}
.col.after .tag{background:#b8432f;color:#fff}
.card{background:#fff;border:1px solid #e3ddd0;border-radius:12px;box-shadow:0 10px 30px rgba(60,40,20,.12);overflow:hidden}
.card img{display:block;width:100%;max-height:420px;object-fit:cover;object-position:top}
.arrow{font-size:40px;color:#b8432f}
.foot{position:absolute;left:64px;bottom:44px;display:flex;align-items:center;gap:12px;font-size:17px;color:#5a554c}
.foot img{width:36px;height:36px}
.foot b{color:#1f1d1a;font-size:20px}
</style>
